[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-options-tasty-trading"
version = "0.1.0"
description = "Deterministic, safety-gated tastytrade options bot"
requires-python = ">=3.12"
dependencies = ["exchange-calendars>=4.10"]

[project.optional-dependencies]
dashboard = ["fastapi>=0.115", "uvicorn[standard]>=0.30"]
streaming = ["websockets>=13"]
test = ["pytest>=8"]

[project.scripts]
optio-bot = "trader.cli:main"

[tool.setuptools.packages.find]
include = ["trader*"]
